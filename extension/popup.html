<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title><span class="i18n" data-i18n="appTitle">Message Channel Tracker</span></title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="title" id="title" data-i18n="appTitle">Message Channel Tracker</div>
      </div>
      <div class="row">
        <label class="switch">
          <input type="checkbox" id="enabledToggle" />
          <span class="slider"></span>
        </label>
        <span id="statusLabel" class="status" data-i18n-text-on="statusOn" data-i18n-text-off="statusOff">Off</span>
      </div>
      <div class="row">
        <label for="previewLength" class="option-label">Preview Length:</label>
        <input type="range" id="previewLength" min="0" max="50" value="10" class="range-input" />
        <span id="previewLengthValue" class="range-value">10</span>
      </div>
    </div>
    <script src="dist/popup.js"></script>
  </body>
</html>
