name: publish-release

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional tag to publish (e.g., v2.0.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect release commit (Changesets)
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "publish=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          MSG=$(git log -1 --pretty=%B)
          CHANGED=$(git diff --name-only HEAD~1 HEAD || true)
          if echo "$MSG" | grep -Ei "release: version packages|version packages|chore:\s*version packages" >/dev/null; then
            echo "publish=true" >> $GITHUB_OUTPUT
          elif echo "$CHANGED" | grep -E "(^|/)CHANGELOG\.md$" >/dev/null; then
            echo "publish=true" >> $GITHUB_OUTPUT
          else
            echo "publish=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm 10
        run: corepack prepare pnpm@10 --activate

      - name: Install dependencies
        if: steps.detect.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      - name: Read current version
        if: steps.detect.outputs.publish == 'true'
        id: ver
        run: |
          VERSION=$(node -pe "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if GitHub Release exists
        if: steps.detect.outputs.publish == 'true'
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ inputs.tag != '' && inputs.tag || format('v{0}', steps.ver.outputs.version) }}
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and package extension
        if: steps.detect.outputs.publish == 'true' && steps.check.outputs.exists == 'false'
        run: pnpm run package:extension

      - name: Create GitHub Release with zip
        if: steps.detect.outputs.publish == 'true' && steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run publish:github
