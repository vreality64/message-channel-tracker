<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <style>
      .bg{fill:#0b1020}
      .title{fill:#e6edf3;font:800 64px/1.1 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto}
      .sub{fill:#a6b3c2;font:700 28px ui-sans-serif,system-ui}
      .pill{fill:none;stroke:url(#g);stroke-width:3}
      .pillText{fill:#e6edf3;font:800 20px ui-sans-serif,system-ui}
      .logo{fill:#fff}
      .chip{fill:#0f1629;stroke:#1f2a44;stroke-width:2}
      .chipTitle{fill:#a6b3c2;font:700 16px ui-sans-serif,system-ui}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="630"/>
  <g opacity="0.6">
    <ellipse cx="220" cy="120" rx="260" ry="80" fill="url(#glow1)"/>
    <ellipse cx="980" cy="80" rx="240" ry="70" fill="url(#glow1)"/>
  </g>
  <g transform="translate(80,158)">
    <g transform="translate(0,-26)">
      <rect x="0" y="0" width="52" height="52" rx="12" fill="url(#g)"/>
      <path class="logo" d="M8 12h36a2 2 0 0 1 0 4H8a2 2 0 0 1 0-4Zm0 10h30a2 2 0 0 1 0 4H8a2 2 0 0 1 0-4Zm0 10h24a2 2 0 0 1 0 4H8a2 2 0 0 1 0-4Z"/>
    </g>
    <text class="title" x="72" y="0" dominant-baseline="middle">MCT Playground</text>
    <text class="sub" x="0" y="92">브라우저 메시지를 실시간으로 테스트하고 확인하세요</text>
    <g transform="translate(0,150)">
      <rect class="pill" x="0" y="-24" rx="16" ry="16" width="900" height="48"/>
      <text class="pillText" x="16" y="8">window.postMessage · MessageChannel · BroadcastChannel · Worker/ServiceWorker</text>
    </g>
  </g>
  <!-- Decorative mini console chip -->
  <g transform="translate(820,360)">
    <rect class="chip" x="0" y="0" width="300" height="180" rx="14"/>
    <text class="chipTitle" x="16" y="28">Console UI</text>
    <g transform="translate(16,48)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#d6e9ff">
      <rect x="0" y="-6" width="268" height="28" rx="6" fill="#0a0f1e" stroke="#17203a"/>
      <text x="10" y="14">in → postMessage → out</text>
      <g fill="#7aa2f7">
        <rect x="6" y="36" width="260" height="2" rx="1"/>
        <rect x="6" y="66" width="180" height="2" rx="1"/>
        <rect x="6" y="96" width="220" height="2" rx="1"/>
      </g>
    </g>
  </g>
</svg>
