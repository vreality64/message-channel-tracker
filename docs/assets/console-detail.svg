<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="DevTools 콘솔에서 메시지 채널 로그 상세 화면">
  <defs>
    <linearGradient id="g-accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <style>
      .bg{fill:#0b1020}
      .panel{fill:#0f1629;stroke:#1f2a44;stroke-width:2}
      .hdr{fill:#0f1629}
      .title{fill:#e6edf3;font:800 14px ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto}
      .tab{fill:#a6b3c2;font:700 11px ui-sans-serif,system-ui}
      .mono{fill:#c9d4e5;font:500 13px SFMono-Regular,ui-monospace,Menlo,monospace}
      .muted{fill:#8ea0b8;font:500 12px SFMono-Regular,ui-monospace,Menlo,monospace}
      .badge{fill:transparent;stroke:url(#g-accent);stroke-width:2}
      .badgeText{fill:#e6edf3;font:800 11px ui-sans-serif,system-ui}
      .bar1{fill:#22d3ee}.bar2{fill:#0ea5e9}.bar3{fill:#6ee7b7}.bar4{fill:#f59e0b}
      .div{stroke:#1f2a44;stroke-width:1}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="540"/>
  <g transform="translate(40,36)">
    <rect class="panel" x="0" y="0" rx="14" ry="14" width="880" height="468"/>
    <g transform="translate(0,0)">
      <rect class="hdr" x="0" y="0" rx="14" ry="14" width="880" height="40"/>
      <circle cx="20" cy="20" r="5" fill="#ef4444"/>
      <circle cx="34" cy="20" r="5" fill="#f59e0b"/>
      <circle cx="48" cy="20" r="5" fill="#10b981"/>
      <text class="title" x="72" y="24">Console</text>
      <g transform="translate(694,16)">
        <text class="tab" x="0" y="0">Elements</text>
        <text class="tab" x="62" y="0" fill="#e6edf3">Console</text>
        <text class="tab" x="118" y="0">Network</text>
      </g>
    </g>
    <g transform="translate(0,48)">
      <!-- window.postMessage -->
      <g transform="translate(18,8)">
        <rect x="0" y="0" width="6" height="70" rx="3" class="bar1"/>
        <g transform="translate(14,-2)">
          <rect x="0" y="0" width="154" height="24" rx="9" class="badge"/>
          <text class="badgeText" x="10" y="16">window.postMessage</text>
        </g>
        <g transform="translate(14,28)">
          <text class="mono" x="0" y="0">"hello from MCT"</text>
          <text class="muted" x="168" y="0">target: *</text>
        </g>
        <g transform="translate(14,50)">
          <text class="muted" x="0" y="0">at page → window</text>
        </g>
      </g>
      <line class="div" x1="18" y1="92" x2="862" y2="92"/>
      <!-- MessageChannel -->
      <g transform="translate(18,108)">
        <rect x="0" y="0" width="6" height="82" rx="3" class="bar2"/>
        <g transform="translate(14,-2)">
          <rect x="0" y="0" width="182" height="24" rx="9" class="badge"/>
          <text class="badgeText" x="10" y="16">MessageChannel / Port</text>
        </g>
        <g transform="translate(14,28)">
          <text class="mono" x="0" y="0">port.postMessage({type: "PING"})</text>
        </g>
        <g transform="translate(14,50)">
          <text class="muted" x="0" y="0">port.onmessage → { type: "PONG" }</text>
        </g>
      </g>
      <line class="div" x1="18" y1="200" x2="862" y2="200"/>
      <!-- BroadcastChannel -->
      <g transform="translate(18,216)">
        <rect x="0" y="0" width="6" height="68" rx="3" class="bar3"/>
        <g transform="translate(14,-2)">
          <rect x="0" y="0" width="142" height="24" rx="9" class="badge"/>
          <text class="badgeText" x="10" y="16">BroadcastChannel</text>
        </g>
        <g transform="translate(14,28)">
          <text class="mono" x="0" y="0">channel.postMessage("update:ready")</text>
        </g>
      </g>
      <line class="div" x1="18" y1="292" x2="862" y2="292"/>
      <!-- Worker / SW -->
      <g transform="translate(18,308)">
        <rect x="0" y="0" width="6" height="80" rx="3" class="bar4"/>
        <g transform="translate(14,-2)">
          <rect x="0" y="0" width="120" height="24" rx="9" class="badge"/>
          <text class="badgeText" x="10" y="16">Worker / SW</text>
        </g>
        <g transform="translate(14,28)">
          <text class="mono" x="0" y="0">worker.postMessage({ event: "start" })</text>
        </g>
      </g>
    </g>
  </g>
</svg>
